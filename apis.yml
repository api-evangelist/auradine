name: Auradine (Velaura AI)
description: >-
  Auradine, Inc. is a Silicon Valley semiconductor and infrastructure company
  founded in 2022, in 2026 rebranded as Velaura AI, Inc. The company designs
  ultra-low-power compute solutions for data center, edge, and physical AI
  applications, anchored by its Titan Core silicon design and IP platform that
  reduces the power required for AI compute while maintaining performance. Its
  Teraflux product line delivers high-efficiency Bitcoin mining hardware
  (3nm ASICs, air- and hydro-cooled miners, containers, and fleet management
  software) deployed by leading Bitcoin data center operators. Auradine raised
  over $300 million across its funding rounds, including a $153M Series C, and
  is backed by investors including DCVC. This is a company profile in the API
  Evangelist network; Auradine/Velaura AI publishes no public developer API or
  developer portal at this time.
